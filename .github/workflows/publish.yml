name: Build, Test & Publish to NuGet

on:
  push:
    branches: [ master, release/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, release/** ]

permissions:
  contents: read
  id-token: write # Required for NuGet Trusted Publishing (OIDC)

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run integration tests
        run: dotnet test --no-build -c Release --verbosity normal

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet package
        run: dotnet pack ./OpcUa.NetBridge/OpcUa.NetBridge.csproj -c Release -o ./nupkg

      - name: NuGet Login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: losapiens

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://nuget.org --skip-duplicate
